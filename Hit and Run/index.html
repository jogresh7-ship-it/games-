<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Hit &amp; Run: Maple Springs</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: "Trebuchet MS", Verdana, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #touch { position: fixed; inset: auto 0 0 0; height: 45%; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  .b { position: absolute; bottom: 20px; width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.5); color: #fff; font: bold 22px sans-serif; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  #tl { left: 16px; } #tr { left: 104px; } #tg { right: 20px; width: 90px; height: 90px; background: rgba(60,200,90,.35); } #tb { right: 122px; background: rgba(220,60,60,.35); } #th { right: 40px; bottom: 124px; width: 56px; height: 56px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"><div class="b" id="tl">◀</div><div class="b" id="tr">▶</div><div class="b" id="tb">◼</div><div class="b" id="tg">GO</div><div class="b" id="th">HORN</div></div>
<script>
(() => {
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let VW = 0, VH = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); resize();

// ---------- random ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- sound ----------
let ac = null, engine = null, engGain = null, siren = null, sirenGain = null;
function au() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    engine = ac.createOscillator(); engine.type = "sawtooth"; engGain = ac.createGain(); engGain.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
    engine.connect(lp); lp.connect(engGain); engGain.connect(ac.destination); engine.start();
    siren = ac.createOscillator(); siren.type = "square"; sirenGain = ac.createGain(); sirenGain.gain.value = 0;
    siren.connect(sirenGain); sirenGain.connect(ac.destination); siren.start();
  }
  if (ac.state === "suspended") ac.resume();
}
function tone(f, d, type = "square", v = 0.05, slide = 0, delay = 0) {
  if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.1) {
  if (!ac) return; const b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / x.length);
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(ac.destination); s.start();
}
const SND = {
  coin() { tone(1200, 0.06, "square", 0.04); tone(1800, 0.12, "square", 0.04, 0, 0.05); },
  smash() { noise(0.25, 0.14); tone(160, 0.15, "triangle", 0.08, -80); },
  bump() { noise(0.12, 0.08); },
  horn() { tone(330, 0.35, "square", 0.05); tone(415, 0.35, "square", 0.04); },
  done() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, "square", 0.05, 0, i * 0.11)); },
  fail() { [400, 300, 200].forEach((f, i) => tone(f, 0.2, "sawtooth", 0.05, 0, i * 0.15)); },
  check() { tone(880, 0.1, "triangle", 0.08); tone(1320, 0.18, "triangle", 0.08, 0, 0.08); },
  busted() { [600, 500, 400, 300].forEach((f, i) => tone(f, 0.18, "square", 0.06, 0, i * 0.14)); },
};

// ---------- input ----------
const K = {}, P1 = {};
const MAP = { ArrowUp: "gas", KeyW: "gas", ArrowDown: "brake", KeyS: "brake", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Space: "hand", KeyH: "horn", KeyE: "horn", Enter: "start", KeyP: "start", Escape: "start", KeyM: "map" };
addEventListener("keydown", (e) => { const k = MAP[e.code]; if (!k) return; e.preventDefault(); au(); if (!K[k]) P1[k] = true; K[k] = true; });
addEventListener("keyup", (e) => { const k = MAP[e.code]; if (k) K[k] = false; });
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) document.body.classList.add("touch");
for (const [id, k] of [["tl", "left"], ["tr", "right"], ["tg", "gas"], ["tb", "brake"], ["th", "horn"]]) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); au(); if (!K[k]) P1[k] = true; K[k] = true; });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, () => { K[k] = false; });
}
cv.addEventListener("pointerdown", () => { au(); P1.start = true; });

// ---------- town ----------
const BLOCK = 320, ROAD = 110, N = 9;           // N x N blocks
const CELL = BLOCK + ROAD, WORLD = N * CELL + ROAD;
const blocks = [], props = [], coins = [], trees = [];
const PALETTE = ["#e8a87c", "#c38d9e", "#85cdca", "#e27d60", "#41b3a3", "#f2d388", "#a3c4f3", "#cdb4db", "#b5e48c"];
const NAMES = { shop: "Quik-Stop", plant: "Power Plant", school: "School", tavern: "Pete's Diner", home: "Hank's House", park: "Park", church: "Town Hall", lab: "Burger Barn", tower: "TV Tower" };
const landmarks = {};
function buildTown() {
  seed = 7;
  const special = { "1,1": "home", "4,4": "park", "7,1": "plant", "1,6": "school", "6,6": "shop", "3,2": "tavern", "5,8": "church", "8,4": "lab", "2,8": "tower" };
  for (let by = 0; by < N; by++) for (let bx = 0; bx < N; bx++) {
    const x = ROAD + bx * CELL, y = ROAD + by * CELL, kind = special[bx + "," + by] || "normal";
    const b = { x, y, w: BLOCK, h: BLOCK, kind, houses: [] };
    if (kind === "park") {
      for (let i = 0; i < 14; i++) trees.push({ x: x + 30 + rnd() * (BLOCK - 60), y: y + 30 + rnd() * (BLOCK - 60), r: 16 + rnd() * 10 });
    } else if (kind !== "normal") {
      b.houses.push({ x: x + 50, y: y + 50, w: BLOCK - 100, h: BLOCK - 100, color: kind === "plant" ? "#9aa0a6" : kind === "home" ? "#f4a3c0" : PALETTE[Math.floor(rnd() * PALETTE.length)], big: true, kind });
      landmarks[kind] = { x: x + BLOCK / 2, y: y + BLOCK / 2, door: { x: x + BLOCK / 2, y: y + BLOCK + ROAD / 2 } };
    } else {
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        const hw = 100 + rnd() * 30, hh = 90 + rnd() * 30;
        b.houses.push({ x: x + 20 + i * 160 + rnd() * 10, y: y + 20 + j * 160 + rnd() * 10, w: hw, h: hh, color: PALETTE[Math.floor(rnd() * PALETTE.length)] });
      }
      for (let k = 0; k < 2; k++) trees.push({ x: x + 140 + rnd() * 40, y: y + 20 + rnd() * (BLOCK - 40), r: 14 + rnd() * 6 });
    }
    blocks.push(b);
  }
  // smashable props along the sidewalks + coins on the roads
  for (let i = 0; i < 260; i++) {
    const b = blocks[Math.floor(rnd() * blocks.length)];
    const side = Math.floor(rnd() * 4), t = 20 + rnd() * (BLOCK - 40);
    let x = b.x + t, y = b.y - 14;
    if (side === 1) { x = b.x + t; y = b.y + BLOCK + 14; }
    if (side === 2) { x = b.x - 14; y = b.y + t; }
    if (side === 3) { x = b.x + BLOCK + 14; y = b.y + t; }
    const kinds = ["crate", "cone", "bin", "mailbox", "hydrant", "crate", "cone"];
    props.push({ x, y, kind: kinds[Math.floor(rnd() * kinds.length)], alive: true, vx: 0, vy: 0, rot: 0, t: 0 });
  }
  for (let i = 0; i < 160; i++) {
    const horiz = rnd() < 0.5, lane = Math.floor(rnd() * (N + 1));
    const along = ROAD + rnd() * (WORLD - 2 * ROAD);
    const c = horiz ? { x: along, y: lane * CELL + ROAD / 2 } : { x: lane * CELL + ROAD / 2, y: along };
    coins.push({ ...c, alive: true, t: rnd() * 6 });
  }
}
buildTown();
function inBuilding(x, y, pad = 0) {
  const bx = Math.floor((x - ROAD) / CELL), by = Math.floor((y - ROAD) / CELL);
  const b = blocks[by * N + bx];
  if (!b || bx < 0 || by < 0 || bx >= N || by >= N) return null;
  for (const h of b.houses) if (x > h.x - pad && x < h.x + h.w + pad && y > h.y - pad && y < h.y + h.h + pad) return h;
  return null;
}
function onRoad(x, y) {
  const lx = ((x % CELL) + CELL) % CELL, ly = ((y % CELL) + CELL) % CELL;
  return lx < ROAD || ly < ROAD;
}

// ---------- cars ----------
function makeCar(x, y, ang, color, kind = "player") {
  return { x, y, ang, vx: 0, vy: 0, steer: 0, color, kind, w: 46, h: 24, hp: 100, t: 0 };
}
const player = makeCar(landmarks.home.door.x, landmarks.home.door.y, 0, "#e94b3c");
const traffic = [];
for (let i = 0; i < 22; i++) {
  const horiz = i % 2 === 0, lane = 1 + Math.floor(rnd() * (N - 1));
  const along = ROAD + rnd() * (WORLD - 2 * ROAD);
  const dir = rnd() < 0.5 ? 1 : -1;
  const off = dir * 22;
  const c = horiz ? makeCar(along, lane * CELL + ROAD / 2 + off, dir > 0 ? 0 : Math.PI, PALETTE[i % PALETTE.length], "traffic")
                  : makeCar(lane * CELL + ROAD / 2 - off, along, dir > 0 ? Math.PI / 2 : -Math.PI / 2, PALETTE[(i + 3) % PALETTE.length], "traffic");
  c.speed = 2 + rnd() * 1.2; traffic.push(c);
}
const cops = [];

function carPhysics(c, gas, brake, steerIn, hand, dt) {
  const fx = Math.cos(c.ang), fy = Math.sin(c.ang);
  let fwd = c.vx * fx + c.vy * fy, side = -c.vx * fy + c.vy * fx;
  const maxF = c.kind === "cop" ? 9.2 : 8.4;
  if (gas) fwd += 0.22; if (brake) fwd -= fwd > 0.5 ? 0.35 : 0.14;
  fwd = clamp(fwd, -3.2, maxF);
  fwd *= gas || brake ? 0.992 : 0.975;
  c.steer = lerp(c.steer, steerIn, 0.25);
  const turn = c.steer * clamp(Math.abs(fwd) / 4, 0, 1) * 0.055 * Math.sign(fwd || 1);
  c.ang += turn * (hand ? 1.5 : 1);
  side *= hand ? 0.94 : 0.75;                       // grip (handbrake = drift)
  c.drift = Math.abs(side);
  const nfx = Math.cos(c.ang), nfy = Math.sin(c.ang);
  c.vx = nfx * fwd - nfy * side; c.vy = nfy * fwd + nfx * side;
  moveCar(c);
  return fwd;
}
function moveCar(c) {
  for (const axis of ["x", "y"]) {
    const v = axis === "x" ? c.vx : c.vy;
    c[axis] += v;
    const hit = inBuilding(c.x, c.y, 14) || c.x < 10 || c.y < 10 || c.x > WORLD - 10 || c.y > WORLD - 10;
    if (hit) {
      c[axis] -= v;
      const sp = Math.hypot(c.vx, c.vy);
      if (axis === "x") c.vx *= -0.35; else c.vy *= -0.35;
      if (c === player && sp > 3) { SND.bump(); shake = Math.min(12, sp * 1.5); }
    }
  }
}

// ---------- missions ----------
const MISSIONS = [
  { title: "Breakfast Run", text: "Hank's out of donuts. Drive to the Quik-Stop!", type: "goto", target: "shop", time: 60 },
  { title: "Late for Work", text: "Get to the Power Plant before the whistle!", type: "goto", target: "plant", time: 55 },
  { title: "Coin Collector", text: "Grab 15 coins around town.", type: "coins", count: 15, time: 75 },
  { title: "Spring Cleaning", text: "Smash 12 crates, cones or bins.", type: "smash", count: 12, time: 60 },
  { title: "Checkpoint Rally", text: "Hit every checkpoint in order!", type: "rally", points: ["tavern", "school", "tower", "church", "lab"], time: 120 },
  { title: "The Big Getaway", text: "Fill the Hit & Run meter, then lose the cops and get home!", type: "escape", time: 150 },
];
const G = { mode: "title", t: 0, coins: 0, mission: 0, mt: 0, mprog: 0, rallyI: 0, meter: 0, wanted: false, busted: 0, msg: "", msgT: 0, smashed: 0, banner: null, paused: false, best: 0 };
try { G.best = Number(localStorage.getItem("hitrun_best")) || 0; } catch (e) {}
let shake = 0, parts = [], camX = player.x, camY = player.y, zoom = 1;
function startMission(i) {
  G.mission = i; const m = MISSIONS[i]; if (!m) { G.mode = "won"; return; }
  G.mt = m.time * 60; G.mprog = 0; G.rallyI = 0; G.mstart = { coins: G.coins, smashed: G.smashed };
  G.banner = { title: m.title, text: m.text, t: 0 }; G.mode = "play";
}
function missionTarget() {
  const m = MISSIONS[G.mission]; if (!m) return null;
  if (m.type === "goto") return landmarks[m.target].door;
  if (m.type === "rally") return landmarks[m.points[G.rallyI]]?.door;
  if (m.type === "escape" && G.meter >= 100 && !G.wanted) return landmarks.home.door;
  if (m.type === "escape" && G.escaped) return landmarks.home.door;
  return null;
}
function say(s) { G.msg = s; G.msgT = 150; }
function completeMission() {
  SND.done(); const bonus = 50 + Math.floor(G.mt / 60) * 2; G.coins += bonus; say(`MISSION COMPLETE! +${bonus} coins`);
  G.mode = "between"; G.bt = 0;
}
function failMission(why) { SND.fail(); say(why); G.mode = "failed"; G.bt = 0; }

// ---------- update ----------
function addMeter(n) {
  G.meter = Math.min(100, G.meter + n);
  if (G.meter >= 100 && !G.wanted) {
    G.wanted = true; say("HIT & RUN! The cops are coming!");
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      let x = player.x + Math.cos(a) * 700, y = player.y + Math.sin(a) * 700;
      x = Math.round(x / CELL) * CELL + ROAD / 2; y = clamp(y, ROAD, WORLD - ROAD);
      const c = makeCar(clamp(x, 60, WORLD - 60), y, 0, "#1d3557", "cop"); cops.push(c);
    }
  }
}
function update() {
  G.t++;
  if (shake > 0) shake *= 0.85;
  const playing = G.mode === "play";
  // player
  const steer = (K.right ? 1 : 0) - (K.left ? 1 : 0);
  const fwd = carPhysics(player, playing && K.gas, playing && K.brake, playing ? steer : 0, K.hand, 1);
  if (P1.horn) SND.horn();
  if (engGain) { engGain.gain.value = G.mode === "title" ? 0 : 0.025; engine.frequency.value = 50 + Math.abs(fwd) * 22; }
  const speed = Math.hypot(player.vx, player.vy);
  if (player.drift > 2.2 && speed > 4 && G.t % 2 === 0) parts.push({ x: player.x - Math.cos(player.ang) * 18, y: player.y - Math.sin(player.ang) * 18, vx: 0, vy: 0, t: 0, k: "smoke" });
  // props
  for (const p of props) {
    if (!p.alive) { if (p.t < 90) { p.t++; p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy *= 0.93; p.rot += 0.2; } continue; }
    if (Math.hypot(p.x - player.x, p.y - player.y) < 26 && speed > 1.5) {
      p.alive = false; p.vx = player.vx * 1.2 + (Math.random() - 0.5) * 3; p.vy = player.vy * 1.2 + (Math.random() - 0.5) * 3;
      G.smashed++; SND.smash(); shake = 5; addMeter(p.kind === "hydrant" ? 14 : 9);
      for (let i = 0; i < 8; i++) parts.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 6 + player.vx * 0.5, vy: (Math.random() - 0.5) * 6 + player.vy * 0.5, t: 0, k: p.kind === "hydrant" ? "water" : "chip" });
      if (Math.random() < 0.4) { G.coins++; SND.coin(); }
    }
  }
  // coins
  for (const c of coins) {
    if (!c.alive) continue; c.t += 0.08;
    if (Math.hypot(c.x - player.x, c.y - player.y) < 28) { c.alive = false; G.coins++; SND.coin(); parts.push({ x: c.x, y: c.y, vx: 0, vy: -1, t: 0, k: "spark" }); }
  }
  // traffic: follow its lane, stop for the player, bump
  for (const c of traffic) {
    const fx = Math.cos(c.ang), fy = Math.sin(c.ang);
    const ahead = Math.hypot(c.x + fx * 60 - player.x, c.y + fy * 60 - player.y) < 50;
    const target = ahead ? 0 : c.speed;
    const cur = c.vx * fx + c.vy * fy;
    const sp = lerp(cur, target, 0.05);
    c.vx = lerp(c.vx, fx * sp, 0.2); c.vy = lerp(c.vy, fy * sp, 0.2);
    c.x += c.vx; c.y += c.vy;
    if (c.x < 0) c.x += WORLD; if (c.x > WORLD) c.x -= WORLD; if (c.y < 0) c.y += WORLD; if (c.y > WORLD) c.y -= WORLD;
    const d = Math.hypot(c.x - player.x, c.y - player.y);
    if (d < 40) {
      const nx = (player.x - c.x) / (d || 1), ny = (player.y - c.y) / (d || 1);
      player.vx += nx * 2; player.vy += ny * 2; player.x += nx * 3; player.y += ny * 3;
      if (!c.bumpT || G.t - c.bumpT > 40) { c.bumpT = G.t; SND.bump(); shake = 6; if (speed > 3) addMeter(12); }
    }
  }
  // cops chase while wanted
  for (const c of cops) {
    const dx = player.x - c.x, dy = player.y - c.y, d = Math.hypot(dx, dy);
    const want = Math.atan2(dy, dx);
    let da = ((want - c.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    carPhysics(c, G.wanted, false, clamp(da * 2, -1, 1), false, 1);
    if (d < 44 && G.wanted && playing) {
      G.busted++;
      const nx = dx / (d || 1), ny = dy / (d || 1); player.vx += nx * 1.5; player.vy += ny * 1.5;
    }
  }
  if (G.wanted) {
    if (sirenGain) { sirenGain.gain.value = 0.012; siren.frequency.value = Math.floor(G.t / 20) % 2 ? 660 : 880; }
    const near = cops.some((c) => Math.hypot(c.x - player.x, c.y - player.y) < 520);
    G.meter -= near ? 0.03 : 0.22;
    if (G.busted > 150) {
      const fine = Math.min(G.coins, 50); G.coins -= fine; SND.busted(); say(`BUSTED! Fined ${fine} coins.`);
      G.wanted = false; G.meter = 0; G.busted = 0; cops.length = 0;
      if (MISSIONS[G.mission]?.type === "escape") failMission("BUSTED! Mission failed.");
    }
    if (G.wanted && G.meter <= 0) {
      G.wanted = false; G.meter = 0; G.busted = 0; cops.length = 0; say("You lost the cops!"); SND.check();
      if (MISSIONS[G.mission]?.type === "escape") G.escaped = true;
    }
  } else {
    if (sirenGain) sirenGain.gain.value = 0;
    G.meter = Math.max(0, G.meter - 0.04); G.busted = Math.max(0, G.busted - 1);
  }
  // mission logic
  if (playing) {
    const m = MISSIONS[G.mission];
    if (m) {
      G.mt--;
      if (m.type === "goto" && Math.hypot(player.x - landmarks[m.target].door.x, player.y - landmarks[m.target].door.y) < 60) completeMission();
      if (m.type === "coins") { G.mprog = G.coins - G.mstart.coins; if (G.mprog >= m.count) completeMission(); }
      if (m.type === "smash") { G.mprog = G.smashed - G.mstart.smashed; if (G.mprog >= m.count) completeMission(); }
      if (m.type === "rally") {
        const p = landmarks[m.points[G.rallyI]].door;
        if (Math.hypot(player.x - p.x, player.y - p.y) < 60) { G.rallyI++; SND.check(); if (G.rallyI >= m.points.length) completeMission(); else say(`Checkpoint ${G.rallyI}/${m.points.length}`); }
      }
      if (m.type === "escape" && G.escaped) {
        const h = landmarks.home.door;
        if (Math.hypot(player.x - h.x, player.y - h.y) < 60) completeMission();
      }
      if (G.mode === "play" && G.mt <= 0) failMission("Out of time! Mission failed.");
    }
  }
  if (G.mode === "between" || G.mode === "failed") {
    G.bt++;
    if (G.bt > 150) { const next = G.mode === "between" ? G.mission + 1 : G.mission; G.escaped = false; startMission(next); }
  }
  if (G.banner) { G.banner.t++; if (G.banner.t > 220) G.banner = null; }
  if (G.msgT > 0) G.msgT--;
  for (const p of parts) { p.t++; p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; }
  parts = parts.filter((p) => p.t < (p.k === "smoke" ? 40 : 30));
  // camera: look ahead, zoom out with speed
  const tz = clamp(1.25 - speed * 0.045, 0.82, 1.25);
  zoom = lerp(zoom, tz, 0.03);
  camX = lerp(camX, player.x + player.vx * 18, 0.1); camY = lerp(camY, player.y + player.vy * 18, 0.1);
}

// ---------- drawing ----------
function drawCar(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.ang);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-c.w / 2 + 3, -c.h / 2 + 4, c.w, c.h);
  const r = 7;
  ctx.fillStyle = c.color; ctx.beginPath(); ctx.roundRect(-c.w / 2, -c.h / 2, c.w, c.h, r); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#bfe3ff"; ctx.beginPath(); ctx.roundRect(4, -c.h / 2 + 3, 10, c.h - 6, 3); ctx.fill();   // windshield
  ctx.fillStyle = "#8fb8d8"; ctx.beginPath(); ctx.roundRect(-15, -c.h / 2 + 4, 7, c.h - 8, 2); ctx.fill(); // rear window
  ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(-8, -c.h / 2 + 3, 12, c.h - 6);                     // roof shine
  ctx.fillStyle = "#fff6b0"; ctx.fillRect(c.w / 2 - 3, -c.h / 2 + 2, 3, 5); ctx.fillRect(c.w / 2 - 3, c.h / 2 - 7, 3, 5);
  ctx.fillStyle = "#c0392b"; ctx.fillRect(-c.w / 2, -c.h / 2 + 2, 2, 5); ctx.fillRect(-c.w / 2, c.h / 2 - 7, 2, 5);
  if (c.kind === "cop") {
    ctx.fillStyle = "#fff"; ctx.fillRect(-6, -c.h / 2, 10, c.h);
    ctx.fillStyle = Math.floor(G.t / 8) % 2 ? "#ff2d2d" : "#2d7bff"; ctx.fillRect(-4, -8, 6, 7);
    ctx.fillStyle = Math.floor(G.t / 8) % 2 ? "#2d7bff" : "#ff2d2d"; ctx.fillRect(-4, 1, 6, 7);
  }
  if (c === player) { // the driver: Hank, an original character (big round head, green cap)
    ctx.fillStyle = "#f2c79a"; ctx.beginPath(); ctx.arc(-2, -3, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#2e8b57"; ctx.beginPath(); ctx.arc(-3, -3, 5, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  }
  ctx.restore();
}
function drawProp(p) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  if (!p.alive) ctx.globalAlpha = Math.max(0, 1 - p.t / 90);
  switch (p.kind) {
    case "crate": ctx.fillStyle = "#b07d48"; ctx.fillRect(-9, -9, 18, 18); ctx.strokeStyle = "#7a5230"; ctx.lineWidth = 2; ctx.strokeRect(-9, -9, 18, 18); ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.stroke(); break;
    case "cone": ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.arc(0, 0, 2, 0, 7); ctx.fill(); break;
    case "bin": ctx.fillStyle = "#4b6b4b"; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill(); ctx.strokeStyle = "#2f452f"; ctx.lineWidth = 2; ctx.stroke(); break;
    case "mailbox": ctx.fillStyle = "#2a5db0"; ctx.fillRect(-6, -9, 12, 18); ctx.fillStyle = "#e33"; ctx.fillRect(4, -9, 3, 6); break;
    case "hydrant": ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill(); break;
  }
  ctx.restore();
}
function drawWorld() {
  const x0 = camX - VW / 2 / zoom - 60, x1 = camX + VW / 2 / zoom + 60, y0 = camY - VH / 2 / zoom - 60, y1 = camY + VH / 2 / zoom + 60;
  ctx.fillStyle = "#4a4e57"; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);   // asphalt
  // lane markings
  ctx.strokeStyle = "#f4d35e"; ctx.lineWidth = 3; ctx.setLineDash([22, 18]);

    const c = i * CELL + ROAD / 2;

  ctx.setLineDash([]);

    ctx.fillStyle = "#c9c4b8"; ctx.fillRect(b.x - 8, b.y - 8, b.w + 16, b.h + 16);     // sidewalk
    ctx.fillStyle = b.kind === "park" ? "#5fae4e" : "#7cc16b"; ctx.fillRect(b.x, b.y, b.w, b.h);   // grass
    for (const h of b.houses) {
      ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(h.x + 8, h.y + 10, h.w, h.h);
      ctx.fillStyle = h.color; ctx.fillRect(h.x, h.y, h.w, h.h);
      // roof ridge
      ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(h.x, h.y + h.h / 2, h.w, h.h / 2);
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 2; ctx.strokeRect(h.x, h.y, h.w, h.h);
      ctx.beginPath(); ctx.moveTo(h.x, h.y + h.h / 2); ctx.lineTo(h.x + h.w, h.y + h.h / 2); ctx.stroke();
      if (h.kind === "plant") { ctx.fillStyle = "#6c757d"; for (const k of [0.3, 0.7]) { ctx.beginPath(); ctx.arc(h.x + h.w * k, h.y + h.h * 0.5, 34, 0, 7); ctx.fill(); ctx.fillStyle = "#adb5bd"; ctx.beginPath(); ctx.arc(h.x + h.w * k, h.y + h.h * 0.5, 22, 0, 7); ctx.fill(); ctx.fillStyle = "#6c757d"; } }
      if (h.big) {
        ctx.save(); ctx.font = "bold 20px Trebuchet MS"; ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
        ctx.strokeText(NAMES[h.kind], h.x + h.w / 2, h.y + h.h + 32); ctx.fillText(NAMES[h.kind], h.x + h.w / 2, h.y + h.h + 32); ctx.restore();
      }
    }
  }
  for (const t of trees) {
    if (t.x < x0 || t.x > x1 || t.y < y0 || t.y > y1) continue;
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.arc(t.x + 6, t.y + 8, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = "#2f7d32"; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = "#43a047"; ctx.beginPath(); ctx.arc(t.x - t.r * 0.3, t.y - t.r * 0.3, t.r * 0.6, 0, 7); ctx.fill();
  }
  for (const p of props) if (p.x > x0 && p.x < x1 && p.y > y0 && p.y < y1 && (p.alive || p.t < 90)) drawProp(p);
  for (const c of coins) {
    if (!c.alive || c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
    const w = Math.abs(Math.cos(c.t)) * 10 + 2;
    ctx.fillStyle = "#ffd60a"; ctx.beginPath(); ctx.ellipse(c.x, c.y, w, 12, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#b08900"; ctx.lineWidth = 2; ctx.stroke();
  }
  // mission marker
  const tg = missionTarget();
  if (tg) {
    const pulse = 1 + Math.sin(G.t / 8) * 0.15;
    ctx.strokeStyle = "rgba(80,220,255,.9)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(tg.x, tg.y, 46 * pulse, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(80,220,255,.25)"; ctx.fill();
  }
  for (const p of parts) {
    if (p.k === "smoke") { ctx.fillStyle = `rgba(220,220,220,${0.35 * (1 - p.t / 40)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 6 + p.t / 3, 0, 7); ctx.fill(); }
    else if (p.k === "water") { ctx.fillStyle = `rgba(120,190,255,${1 - p.t / 30})`; ctx.fillRect(p.x, p.y, 4, 4); }
    else if (p.k === "spark") { ctx.fillStyle = `rgba(255,230,80,${1 - p.t / 30})`; ctx.beginPath(); ctx.arc(p.x, p.y, 4 + p.t, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = `rgba(140,100,60,${1 - p.t / 30})`; ctx.fillRect(p.x, p.y, 4, 4); }
  }
  for (const c of traffic) if (c.x > x0 && c.x < x1 && c.y > y0 && c.y < y1) drawCar(c);

}
function text(s, x, y, size, color = "#fff", align = "center") {
  ctx.font = `bold ${size}px "Trebuchet MS", Verdana, sans-serif`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.max(3, size / 4); ctx.strokeStyle = "#000"; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function drawHUD() {
  const m = MISSIONS[G.mission];
  // coins
  ctx.fillStyle = "#ffd60a"; ctx.beginPath(); ctx.arc(28, 30, 12, 0, 7); ctx.fill(); ctx.strokeStyle = "#7a5f00"; ctx.lineWidth = 3; ctx.stroke();
  text(String(G.coins), 48, 31, 22, "#fff", "left");
  // hit & run meter
  const mw = Math.min(260, VW * 0.4), mx = VW / 2 - mw / 2;
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(mx - 4, 14, mw + 8, 22);
  const col = G.wanted ? (Math.floor(G.t / 10) % 2 ? "#ff2d2d" : "#2d7bff") : G.meter > 70 ? "#ff8c1a" : "#ffd60a";
  ctx.fillStyle = col; ctx.fillRect(mx, 18, mw * G.meter / 100, 14);
  text(G.wanted ? "WANTED!" : "HIT & RUN", VW / 2, 46, 12, G.wanted ? "#ff6b6b" : "#fff");
  if (G.wanted && G.busted > 0) { ctx.fillStyle = "#ff2d2d"; ctx.fillRect(mx, 54, mw * Math.min(1, G.busted / 150), 6); }
  // mission panel
  if (m && (G.mode === "play")) {
    const secs = Math.max(0, Math.ceil(G.mt / 60));
    text(`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`, VW - 20, 30, 24, secs <= 10 ? "#ff6b6b" : "#fff", "right");
    let goal = m.text;
    if (m.type === "coins" || m.type === "smash") goal = `${m.title}: ${Math.max(0, G.mprog)}/${m.count}`;
    if (m.type === "rally") goal = `${m.title}: checkpoint ${G.rallyI + 1}/${m.points.length}`;
    if (m.type === "escape") goal = G.escaped ? "Cops lost. Get home!" : G.wanted ? "Lose the cops!" : "Smash stuff to fill the meter!";
    text(goal, VW - 20, 60, 14, "#cfe8ff", "right");
  }
  // arrow toward the target
  const tg = missionTarget();
  if (tg) {
    const a = Math.atan2(tg.y - player.y, tg.x - player.x), d = Math.hypot(tg.x - player.x, tg.y - player.y);
    if (d > 120) {
      ctx.save(); ctx.translate(VW / 2, VH / 2 - 70); ctx.rotate(a);
      ctx.fillStyle = "#50dcff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-10, -13); ctx.lineTo(-4, 0); ctx.lineTo(-10, 13); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      text(Math.round(d / 10) + "m", VW / 2, VH / 2 - 40, 12, "#bdf");
    }
  }
  // minimap
  const S = Math.min(150, VW * 0.28), mmx = 14, mmy = VH - S - 14, k = S / WORLD;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(mmx - 3, mmy - 3, S + 6, S + 6);
  ctx.fillStyle = "#555"; ctx.fillRect(mmx, mmy, S, S);
  for (const b of blocks) { ctx.fillStyle = b.kind === "park" ? "#3f8f3a" : b.kind !== "normal" ? "#8a7ab0" : "#6aa95b"; ctx.fillRect(mmx + b.x * k, mmy + b.y * k, b.w * k, b.h * k); }
  if (tg) { ctx.fillStyle = Math.floor(G.t / 15) % 2 ? "#50dcff" : "#fff"; ctx.beginPath(); ctx.arc(mmx + tg.x * k, mmy + tg.y * k, 4, 0, 7); ctx.fill(); }
  for (const c of cops) { ctx.fillStyle = "#2d7bff"; ctx.fillRect(mmx + c.x * k - 2, mmy + c.y * k - 2, 4, 4); }
  ctx.save(); ctx.translate(mmx + player.x * k, mmy + player.y * k); ctx.rotate(player.ang);
  ctx.fillStyle = "#ff3b30"; ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.fill(); ctx.restore();
  // banners
  if (G.banner) {
    const t = G.banner.t, a = t < 20 ? t / 20 : t > 190 ? (220 - t) / 30 : 1;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, VH * 0.28, VW, 90);
    text(`MISSION ${G.mission + 1}: ${G.banner.title.toUpperCase()}`, VW / 2, VH * 0.28 + 30, 26, "#ffd60a");
    text(G.banner.text, VW / 2, VH * 0.28 + 64, 16);
    ctx.globalAlpha = 1;
  }
  if (G.msgT > 0) text(G.msg, VW / 2, VH * 0.72, 22, "#fff");
  if (G.paused) { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(0, 0, VW, VH); text("PAUSED", VW / 2, VH / 2, 40); }
}
function drawTitle() {
  const cx = VW / 2;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, VW, VH);
  text("HIT & RUN", cx, VH * 0.26, Math.min(90, VW / 7), "#ffd60a");
  text("MAPLE SPRINGS", cx, VH * 0.26 + Math.min(60, VW / 11), Math.min(34, VW / 16), "#ff7a59");
  text("Drive Hank around town, finish missions, smash stuff — and don't get busted.", cx, VH * 0.48, 15);
  text("Arrows / WASD: drive   Space: handbrake drift   H: horn   Enter: pause", cx, VH * 0.54, 13, "#cfe8ff");
  if (Math.floor(G.t / 30) % 2 === 0) text("PRESS ENTER OR TAP TO START", cx, VH * 0.68, 20);
  if (G.best) text(`Best: ${G.best} coins`, cx, VH * 0.76, 14, "#ffd60a");
}
function render() {
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.translate(VW / 2 + sx, VH / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);
  drawWorld();
  ctx.restore();
  if (G.mode === "title") { drawTitle(); return; }
  if (G.mode === "won") {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, VW, VH);
    text("YOU FINISHED EVERY MISSION!", VW / 2, VH * 0.38, Math.min(40, VW / 18), "#ffd60a");
    text(`Coins: ${G.coins}`, VW / 2, VH * 0.5, 24);
    text("Free roam: keep driving, or press Enter for the title screen.", VW / 2, VH * 0.6, 15);
    return;
  }

}
function step() {
  if (G.mode === "title") {
    G.t++; camX += 1.2; camY = WORLD / 2 + Math.sin(G.t / 300) * 400;

  } else if (G.mode === "won") {
    update();
    if (P1.start) { try { if (G.coins > G.best) localStorage.setItem("hitrun_best", String(G.coins)); } catch (e) {} G.best = Math.max(G.best, G.coins); G.mode = "title"; }
  } else {
    if (P1.start && G.mode === "play") G.paused = !G.paused;

}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { acc -= 1000 / 60; n++; for (let k = 0; k < (window.__speed || 1); k++) step(); }
  render();

}
requestAnimationFrame(frame);
if (location.hash === "#debug") window.__hr = { G, player, landmarks, cops, startMission, addMeter };
})();
